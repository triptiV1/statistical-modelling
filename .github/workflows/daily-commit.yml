name: Daily Commit

on:
  schedule:
    - cron: '30 8 * * *' # Runs daily at 08:30 UTC
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Daily Update
        run: |
          echo "Last daily update: $(date -u)" > daily_contribution.txt
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_contribution.txt
          git commit -m "chore: daily automatic contribution $(date +'%Y-%m-%d')" || exit 0
          git push
