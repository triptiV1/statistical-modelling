name: Daily Study Planner & Commit

on:
  schedule:
    - cron: '0 16 * * *' # Runs daily at 16:00 UTC (approx. 09:00 AM local PT)
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  daily-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Issue Content
        run: |
          python3 generate_issue_body.py

      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(cat issue_title.txt)
          gh issue create --title "$TITLE" --body-file issue_body.txt
          rm issue_title.txt issue_body.txt

      - name: Commit Progress Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git commit -m "chore: advance study plan to next day" || exit 0
          git push
