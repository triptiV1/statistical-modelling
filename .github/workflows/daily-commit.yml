name: Daily Commit

on:
  schedule:
    - cron: '0 16 * * *' # Runs daily at 16:00 UTC (approx. 09:00 AM local PT)
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Daily Update
        run: |
          echo "Last daily update: $(date -u)" > daily_contribution.txt
          
      - name: Commit and Push
        run: |
          git config --global user.name "triptiV1"
          git config --global user.email "163966194+triptiV1@users.noreply.github.com"
          git add daily_contribution.txt
          git commit -m "chore: daily automatic contribution $(date +'%Y-%m-%d')" || exit 0
          git push
